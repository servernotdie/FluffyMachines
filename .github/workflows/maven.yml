name: Java CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    if: startsWith(github.event.head_commit.message, '[CI skip]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'
      - name: Configure git
        run: |
          git config user.name "mytai20100"
          git config user.email "142713298+Mytai20100@users.noreply.github.com"

      - name: Apply patches
        run: bash patches/patch.sh

      - name: Build with Maven
        run: mvn package --file pom.xml
